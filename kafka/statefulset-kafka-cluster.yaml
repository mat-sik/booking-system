apiVersion: v1
kind: Service
metadata:
  name: kafka-controller-headless
  namespace: booking-system
spec:
  clusterIP: None
  selector:
    app: kafka-controller
  ports:
    - name: controller
      port: 9093
      targetPort: controller
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka-controller
  namespace: booking-system
spec:
  serviceName: kafka-controller-headless
  replicas: 3
  selector:
    matchLabels:
      app: kafka-controller
  template:
    metadata:
      labels:
        app: kafka-controller
    spec:
      containers:
        - name: kafka
          image: apache/kafka:4.1.1
          env:
            - name: POD_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['apps.kubernetes.io/pod-index']
            - name: KAFKA_NODE_ID
              value: $(POD_INDEX)
            - name: KAFKA_PROCESS_ROLES
              value: controller
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: BROKER
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: CONTROLLER:PLAINTEXT,BROKER:PLAINTEXT
            - name: KAFKA_LISTENERS
              value: CONTROLLER://:9093
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 0@kafka-controller-0.kafka-controller-headless.booking-system.svc.cluster.local:9093,1@kafka-controller-1.kafka-controller-headless.booking-system.svc.cluster.local:9093,2@kafka-controller-2.kafka-controller-headless.booking-system.svc.cluster.local:9093
          ports:
            - name: controller
              containerPort: 9093
          volumeMounts:
            - name: controller
              mountPath: /var/lib/kafka/data
            - name: controller
              mountPath: /etc/kafka/secrets
              subPath: secrets
            - name: controller
              mountPath: /mnt/shared/config
              subPath: config
  volumeClaimTemplates:
    - metadata:
        name: controller
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-broker-headless
  namespace: booking-system
spec:
  clusterIP: None
  selector:
    app: kafka-broker
  ports:
    - name: broker
      port: 19092
      targetPort: broker
    - name: client
      port: 9092
      targetPort: client
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: booking-system
spec:
  type: ClusterIP
  selector:
    app: kafka-broker
  ports:
    - name: client
      port: 9092
      targetPort: client
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-configmap
  namespace: booking-system
data:
  bootstrap-servers: kafka:9092
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka-broker
  namespace: booking-system
spec:
  serviceName: kafka-broker-headless
  replicas: 3
  selector:
    matchLabels:
      app: kafka-broker
  template:
    metadata:
      labels:
        app: kafka-broker
    spec:
      containers:
        - name: kafka
          image: apache/kafka:4.1.1
          command:
            - /bin/bash
            - -c
            - |
              export KAFKA_NODE_ID=$((${POD_INDEX} + 3))
              exec /etc/kafka/docker/run
          ports:
            - name: broker
              containerPort: 19092
            - name: client
              containerPort: 9092
          env:
            - name: KAFKA_PROCESS_ROLES
              value: broker
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: BROKER
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: CONTROLLER:PLAINTEXT,BROKER:PLAINTEXT,CLIENT:PLAINTEXT
            - name: KAFKA_LISTENERS
              value: BROKER://:19092,CLIENT://:9092
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: KAFKA_ADVERTISED_LISTENERS
              value: BROKER://$(POD_NAME).kafka-broker-headless.booking-system.svc.cluster.local:19092,CLIENT://$(POD_NAME).kafka-broker-headless.booking-system.svc.cluster.local:9092
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 0@kafka-controller-0.kafka-controller-headless.booking-system.svc.cluster.local:9093,1@kafka-controller-1.kafka-controller-headless.booking-system.svc.cluster.local:9093,2@kafka-controller-2.kafka-controller-headless.booking-system.svc.cluster.local:9093
            - name: POD_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['apps.kubernetes.io/pod-index']
          volumeMounts:
            - name: broker
              mountPath: /var/lib/kafka/data
            - name: broker
              mountPath: /etc/kafka/secrets
              subPath: secrets
            - name: broker
              mountPath: /mnt/shared/config
              subPath: config
  volumeClaimTemplates:
    - metadata:
        name: broker
      spec:
        accessModes: [ "ReadWriteOnce" ]
        storageClassName: local-storage
        selector:
          matchLabels:
            app: any
        resources:
          requests:
            storage: 1Gi