apiVersion: v1
kind: Service
metadata:
  name: query-service
spec:
  selector:
    app: query-service
  ports:
    - protocol: TCP
      port: 50051
      targetPort: 50051
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: query-service-configmap
data:
  query-service-address: "query-service:50051"
  otel-protocol: "grpc"
  otel-service-name: "query-service"
  otel-traces-exporter: "otlp"
  otel-metrics-exporter: "otlp"
  otel-logs-exporter: "otlp"
  otel-capture-mdc: "*"
  otel-capture-kvp: "true"
  otel-capture-logger-context: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: query-service
spec:
  selector:
    matchLabels:
      app: query-service
  replicas: 1
  template:
    metadata:
      labels:
        app: query-service
    spec:
      containers:
        - name: query-service
          image: query-service:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: BOOKING_SYSTEM_CASSANDRA_CONTACT_POINTS
              valueFrom:
                configMapKeyRef:
                  name: cassandra-configmap
                  key: contact-points
            - name: BOOKING_SYSTEM_CASSANDRA_KEYSPACE_NAME
              valueFrom:
                configMapKeyRef:
                  name: cassandra-configmap
                  key: keyspace-name
            - name: BOOKING_SYSTEM_CASSANDRA_DATACENTER
              valueFrom:
                configMapKeyRef:
                  name: cassandra-configmap
                  key: datacenter
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: otel-collector-configmap
                  key: endpoint
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              valueFrom:
                configMapKeyRef:
                  name: query-service-configmap
                  key: otel-protocol
            - name: OTEL_SERVICE_NAME
              valueFrom:
                configMapKeyRef:
                  name: query-service-configmap
                  key: otel-service-name
            - name: OTEL_TRACES_EXPORTER
              valueFrom:
                configMapKeyRef:
                  name: query-service-configmap
                  key: otel-traces-exporter
            - name: OTEL_METRICS_EXPORTER
              valueFrom:
                configMapKeyRef:
                  name: query-service-configmap
                  key: otel-metrics-exporter
            - name: OTEL_LOGS_EXPORTER
              valueFrom:
                configMapKeyRef:
                  name: query-service-configmap
                  key: otel-logs-exporter
            - name: OTEL_INSTRUMENTATION_LOGBACK_APPENDER_EXPERIMENTAL_CAPTURE_MDC_ATTRIBUTES
              valueFrom:
                configMapKeyRef:
                  name: query-service-configmap
                  key: otel-capture-mdc
            - name: OTEL_INSTRUMENTATION_LOGBACK_APPENDER_EXPERIMENTAL_CAPTURE_KEY_VALUE_PAIR_ATTRIBUTES
              valueFrom:
                configMapKeyRef:
                  name: query-service-configmap
                  key: otel-capture-kvp
            - name: OTEL_INSTRUMENTATION_LOGBACK_APPENDER_EXPERIMENTAL_CAPTURE_LOGGER_CONTEXT_ATTRIBUTES
              valueFrom:
                configMapKeyRef:
                  name: query-service-configmap
                  key: otel-capture-logger-context
          ports:
            - containerPort: 50051
