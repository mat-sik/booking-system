loki:
  deploymentMode: SingleBinary
  loki:
    image:
      tag: 3.6.3
    auth_enabled: false
    commonConfig:
      replication_factor: 1
    schemaConfig:
      configs:
        - from: 2024-04-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            period: 24h
    storage:
      type: filesystem
  test:
    enabled: false
  singleBinary:
    replicas: 1
    persistence:
      enabled: true
      storageClass: local-storage
      size: 1Gi
      selector:
        matchLabels:
          app: loki
  backend:
    replicas: 0
  read:
    replicas: 0
  write:
    replicas: 0
  ingester:
    replicas: 0
  querier:
    replicas: 0
  queryFrontend:
    replicas: 0
  queryScheduler:
    replicas: 0
  distributor:
    replicas: 0
  compactor:
    replicas: 0
  indexGateway:
    replicas: 0
  bloomGateway:
    replicas: 0
  chunksCache:
    enabled: false
  gateway:
    enabled: false
  resultsCache:
    enabled: false
  lokiCanary:
    enabled: false