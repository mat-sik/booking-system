opentelemetry-collector:
  mode: deployment
  image:
    repository: otel/opentelemetry-collector-contrib
    tag: 0.143.1
  config:
    exporters:
      otlp:
        endpoint: booking-system-tempo:4317
        tls:
          insecure: true
      otlphttp:
        endpoint: http://booking-system-loki:3100/otlp
      prometheus:
        endpoint: ${env:MY_POD_IP}:9090
    service:
      pipelines:
        traces:
          exporters:
            - otlp
        metrics:
          exporters:
            - prometheus
        logs:
          exporters:
            - otlphttp

prometheus:
  server:
    image:
      repository: prom/prometheus
      tag: v3.9.1
    service:
      servicePort: 9090
    persistentVolume:
      size: 1G
      storageClass: local-storage
      selector:
        matchLabels:
          app: prometheus
    extraArgs:
      web.enable-remote-write-receiver: null
      enable-feature: exemplar-storage,native-histograms
    global:
      scrape_interval: 1s
      scrape_timeout: 1s
  scrapeConfigs:
    otel-collector:
      static_configs:
        - targets:
            - booking-system-opentelemetry-collector:9090
    prometheus:
      enabled: false
    kubernetes-api-servers:
      enabled: false
    kubernetes-nodes:
      enabled: false
    kubernetes-nodes-cadvisor:
      enabled: false
    kubernetes-service-endpoints:
      enabled: false
    kubernetes-service-endpoints-slow:
      enabled: false
    prometheus-pushgateway:
      enabled: false
    kubernetes-services:
      enabled: false
    kubernetes-pods:
      enabled: false
    kubernetes-pods-slow:
      enabled: false
  configmapReload:
    prometheus:
      enabled: false
  alertmanager:
    enabled: false
  prometheus-node-exporter:
    enabled: false
  prometheus-pushgateway:
    enabled: false
  kube-state-metrics:
    enabled: false

loki:
  deploymentMode: SingleBinary
  loki:
    image:
      tag: 3.6.3
    commonConfig:
      replication_factor: 1
    schemaConfig:
      configs:
        - from: 2024-04-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            period: 24h
    storage:
      type: filesystem
  singleBinary:
    replicas: 1
    persistence:
      enabled: true
      storageClass: local-storage
      size: 1Gi
      selector:
        matchLabels:
          app: loki
  backend:
    replicas: 0
  read:
    replicas: 0
  write:
    replicas: 0
  ingester:
    replicas: 0
  querier:
    replicas: 0
  queryFrontend:
    replicas: 0
  queryScheduler:
    replicas: 0
  distributor:
    replicas: 0
  compactor:
    replicas: 0
  indexGateway:
    replicas: 0
  bloomGateway:
    replicas: 0

tempo:
  tempo:
    tag: 2.9.0
    metricsGenerator:
      enabled: true
      storage:
        path: var/tempo/generator/metrics
      traces_storage:
        path: /var/tempo/generator/traces
  persistence:
    enabled: true
    size: 1G
    storageClassName: local-storage

localPVs:
  - name: cassandra-0
    app: cassandra
    size: 1Gi
    node: minikube

  - name: prometheus-0
    app: prometheus
    size: 1Gi
    node: minikube

  - name: tempo-0
    app: tempo
    size: 1Gi
    node: minikube

  - name: loki-0
    app: loki
    size: 1Gi
    node: minikube

  - name: alloy-0
    app: alloy
    size: 1Gi
    node: minikube

  - name: pv-0
    size: 1Gi
    node: minikube

  - name: pv-1
    size: 1Gi
    node: minikube

  - name: pv-2
    size: 1Gi
    node: minikube

  - name: pv-3
    size: 1Gi
    node: minikube

  - name: pv-4
    size: 1Gi
    node: minikube